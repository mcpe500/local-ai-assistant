<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Voice Notes</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- App Icons -->
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />

    <!-- App Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#3880ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#428cff" />

    <!-- App Description -->
    <meta name="description" content="Voice-enabled AI-powered note-taking application for capturing and understanding meeting tasks" />
    <meta name="keywords" content="voice notes, AI, transcription, meetings, productivity" />
    <meta name="author" content="AI Voice Notes" />

    <!-- Open Graph -->
    <meta property="og:title" content="AI Voice Notes" />
    <meta property="og:description" content="Voice-enabled AI-powered note-taking application" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icon.png" />

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      media-src *;
      img-src 'self' data: content:;
      connect-src 'self' ws: wss: http: https:;
    ">

    <!-- Preload Critical Resources -->
    <link rel="preload" href="/src/main.tsx" as="script" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
